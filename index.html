    <title>Guess the Country | Modern Flag Trivia</title>
    <script type="text/javascript">
      // SPA route restoration for GitHub Pages.
      // Only single-segment paths made of [a-z0-9-] are accepted to prevent
      // open-redirect and path-injection through the ?p= query parameter.
      (function(l) {
        if (!l.search) return;
        var SAFE_PATH = /^\/[A-Za-z0-9_-]+$/;
        var q = {};
        l.search.slice(1).split('&').forEach(function(v) {
          if (!v) return;
          var a = v.split('=');
          q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
        });
        if (q.p !== undefined) {
          var decoded;
          try {
            decoded = decodeURIComponent(q.p);
          } catch (_) {
            return;
          }
          if (!SAFE_PATH.test(decoded)) return;
          var cleanBase = l.pathname.replace(/\/$/, '');
          var fullPath = cleanBase + decoded;
          var extraSearch = q.q && SAFE_PATH.test(decodeURIComponent(q.q)) ? '?' + decodeURIComponent(q.q) : '';
          window.history.replaceState(null, null, fullPath + extraSearch + l.hash);
        }
      }(window.location));
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
