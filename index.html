<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />
    <meta
      name="description"
      content="Test your geography knowledge in Guess the Country, a sleek and fast modern flag guessing game powered by the REST Countries API."
    />
    <title>Guess the Country | Modern Flag Trivia</title>
    <script type="text/javascript">
      // SPA route restoration for GitHub Pages
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            var decodedPath = decodeURIComponent(q.p);
            var cleanBase = l.pathname.replace(/\/$/, '');
            var fullPath = cleanBase + (decodedPath.startsWith('/') ? decodedPath : '/' + decodedPath);
            var extraSearch = q.q ? '?' + decodeURIComponent(q.q) : '';
            window.history.replaceState(null, null, fullPath + extraSearch + l.hash);
          }
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
